name: Test license input (invalid license error path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          channel: stable
          project: chef-workstation
          license: INVALID-LICENSE-ID-FOR-TESTING
          chefDownloadUrl: chefdownload-community.chef.io
      - name: Assert action failed due to invalid license
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid license, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid license"
