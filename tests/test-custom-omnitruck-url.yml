name: Test custom omnitruckUrl
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and install script
        run: |
          # Create a fake install.sh that records the arguments it receives
          cat > /tmp/fake-install.sh << 'EOF'
          #!/bin/bash
          echo "FAKE_INSTALL_CALLED" > /tmp/install-called.txt
          echo "ARGS: $@" >> /tmp/install-called.txt
          echo "Chef install script called with: $@"
          EOF
          chmod +x /tmp/fake-install.sh

          # Create a fake curl that serves the fake install script for any omnitruck URL
          # Supports both "curl URL | bash" and hardened "curl -o FILE URL" forms
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'EOF'
          #!/bin/sh
          out=""
          prev=""
          url=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            # Capture the URL (last non-flag argument)
            case "$arg" in
              http*) url="$arg" ;;
            esac
            prev="$arg"
          done
          # Record the URL that was requested
          echo "URL: $url" >> /tmp/curl-url.txt
          case "$*" in
            *install.sh*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install.sh > "$out"
              else
                cat /tmp/fake-install.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          EOF
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          channel: stable
          project: chef-workstation
          omnitruckUrl: custom.omnitruck.example.com

      - name: Assert install script was called
        run: |
          if [ ! -f /tmp/install-called.txt ]; then
            echo "FAIL: install script was never called"
            exit 1
          fi
          echo "Install script was called:"
          cat /tmp/install-called.txt
          echo "PASS"

      - name: Assert custom omnitruck URL was used
        run: |
          if [ ! -f /tmp/curl-url.txt ]; then
            echo "FAIL: curl URL was not recorded"
            exit 1
          fi
          URL=$(cat /tmp/curl-url.txt)
          echo "actual URL: $URL"
          if ! echo "$URL" | grep -q "custom.omnitruck.example.com"; then
            echo "FAIL: expected 'custom.omnitruck.example.com' in curl URL"
            exit 1
          fi
          echo "PASS: custom omnitruck URL used"
