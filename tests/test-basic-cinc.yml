name: Test basic cinc install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install cinc via omnitruck
        id: action
        uses: .
        with:
          project: cinc
          channel: stable
          omnitruckUrl: omnitruck.cinc.sh
      - name: Assert cinc is installed
        run: |
          if ! command -v cinc-client &>/dev/null; then
            echo "FAIL: cinc-client not found in PATH"
            exit 1
          fi
          echo "PASS: cinc-client is installed"
          cinc-client --version
