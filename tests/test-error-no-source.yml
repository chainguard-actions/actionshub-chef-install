name: Test error when no install source configured
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Attempt install with no source
        id: action
        uses: .
        with:
          project: cinc
          channel: stable
          omnitruckUrl: ''
        continue-on-error: true
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no install source is configured"
            exit 1
          fi
          echo "PASS: action correctly failed with no install source"
