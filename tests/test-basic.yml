name: Test basic usage (default inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fake curl and install script
        run: |
          # Create a fake install.sh that records the arguments it receives
          cat > /tmp/fake-install.sh << 'EOF'
          #!/bin/bash
          echo "FAKE_INSTALL_CALLED" > /tmp/install-called.txt
          echo "ARGS: $@" >> /tmp/install-called.txt
          echo "Chef install script called with: $@"
          EOF
          chmod +x /tmp/fake-install.sh

          # Create a fake curl that serves the fake install script
          # Supports both "curl URL | bash" and hardened "curl -o FILE URL" forms
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'EOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *omnitruck.chef.io/install.sh*)
              if [ -n "$out" ]; then
                cat /tmp/fake-install.sh > "$out"
              else
                cat /tmp/fake-install.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          EOF
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> "$GITHUB_PATH"

      - id: action
        uses: .
        with:
          channel: stable
          project: chef-workstation

      - name: Assert install script was called
        run: |
          if [ ! -f /tmp/install-called.txt ]; then
            echo "FAIL: install script was never called"
            exit 1
          fi
          echo "Install script was called:"
          cat /tmp/install-called.txt
          echo "PASS"

      - name: Assert correct channel was passed
        run: |
          ARGS=$(cat /tmp/install-called.txt)
          echo "actual args: $ARGS"
          if ! echo "$ARGS" | grep -q "\-c stable"; then
            echo "FAIL: expected '-c stable' in args"
            exit 1
          fi
          echo "PASS: channel=stable found"

      - name: Assert correct project was passed
        run: |
          ARGS=$(cat /tmp/install-called.txt)
          echo "actual args: $ARGS"
          if ! echo "$ARGS" | grep -q "\-P chef-workstation"; then
            echo "FAIL: expected '-P chef-workstation' in args"
            exit 1
          fi
          echo "PASS: project=chef-workstation found"

      - name: Assert default version was passed
        run: |
          ARGS=$(cat /tmp/install-called.txt)
          echo "actual args: $ARGS"
          if ! echo "$ARGS" | grep -q "\-v 21.6.497"; then
            echo "FAIL: expected '-v 21.6.497' in args (default version for chef-workstation)"
            exit 1
          fi
          echo "PASS: default version 21.6.497 found"
