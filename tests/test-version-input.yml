name: Test version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          channel: stable
          project: cinc-workstation
          version: latest
      - name: Assert cinc-workstation is installed
        run: |
          if ! command -v cinc-solo &>/dev/null && ! command -v knife &>/dev/null; then
            echo "FAIL: cinc-workstation does not appear to be installed"
            exit 1
          fi
          echo "PASS: cinc-workstation installed successfully with version=latest"
