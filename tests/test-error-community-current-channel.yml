name: Test error when current channel used with community Chef download URL
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with current channel and community URL (should fail)
        id: action
        uses: .
        with:
          project: chef-workstation
          channel: current
          chefDownloadUrl: chefdownload-community.chef.io
          license: fake-license-id-for-testing
        continue-on-error: true

      - name: Assert action failed with correct error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when current channel is used with community Chef download URL"
            exit 1
          fi
          echo "PASS: action correctly failed when current channel used with community URL"
